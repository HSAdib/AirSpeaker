name: AirSpeaker
options:
  bundleIdPrefix: com.hasan
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_NAME: AirSpeaker
    PRODUCT_BUNDLE_IDENTIFIER: com.hasan.airspeaker.v2
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "2.1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

targets:
  AirSpeaker:
    type: application
    platform: iOS
    sources:
      - path: AirSpeaker
    info:
      path: AirSpeaker/Info.plist
      properties:
        CFBundleDisplayName: Air Speaker v2.1
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "Air Speaker uses the camera to scan Party Host QR codes for instant connection."
        NSLocalNetworkUsageDescription: "Air Speaker uses your local network (UDP 5004, 5005) for ultra-low-latency audio streaming and device discovery."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    frameworks:
      - framework: AVFoundation.framework
      - framework: AudioToolbox.framework
      - framework: ReplayKit.framework
      - framework: Network.framework
      - framework: CoreImage.framework
      - framework: SwiftUI.framework
      - framework: UIKit.framework
