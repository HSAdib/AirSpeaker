name: Build & Publish All Deliverables (GitHub Releases & Packages)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build macOS DMG, iOS IPA & Publish to Releases + Packages
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. BUILD MACOS DMG (PhoneSpeaker-v2-macOS.dmg)
      # ----------------------------------------------------
      - name: Set up Python 3.11 for macOS
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install macOS Audio & Build Dependencies via Homebrew
        run: |
          brew install opus portaudio python@3.11 python-tk@3.11 xcodegen oras

      - name: Build macOS Application Bundle & DMG
        run: |
          cd phonespeaker-pc
          /opt/homebrew/bin/python3.11 build_macos.py || python3 build_macos.py

      - name: Verify macOS DMG Artifact
        run: |
          ls -lh PhoneSpeaker-v2-macOS.dmg

      # ----------------------------------------------------
      # 2. BUILD IOS APP & IPA (PhoneSpeaker-v2-iOS.ipa)
      # ----------------------------------------------------
      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd PhoneSpeakeriOS
          xcodegen generate

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          cd PhoneSpeakeriOS
          xcodebuild archive \
            -project PhoneSpeaker.xcodeproj \
            -scheme PhoneSpeaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/PhoneSpeaker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (Payload zip for AltStore / SideStore / Sideloadly)
        run: |
          cd PhoneSpeakeriOS
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/PhoneSpeaker.xcarchive/Products/Applications/PhoneSpeaker.app" Payload/
          zip -r -q ../PhoneSpeaker-v2-iOS.ipa Payload
          cd ..
          ls -lh PhoneSpeaker-v2-iOS.ipa

      # ----------------------------------------------------
      # 3. UPLOAD WORKFLOW ARTIFACTS
      # ----------------------------------------------------
      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-macOS-DMG
          path: PhoneSpeaker-v2-macOS.dmg

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-iOS-IPA
          path: PhoneSpeaker-v2-iOS.ipa

      # ----------------------------------------------------
      # 4. PUBLISH ALL DEVICE INSTALLERS TO GITHUB RELEASE (v2.0.0 / Latest)
      # ----------------------------------------------------
      - name: Publish All Device Installers to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v2.0.0"
          fi

          cat << 'EOF' > RELEASE_NOTES.md
          ### PhoneSpeaker v2.0 Studio

          Low-latency wireless audio streaming & wireless mic studio for Windows 11/10, Android, Linux, macOS, and iOS.

          Turn your phone into a low-latency wireless speaker or wireless microphone for your PC, Mac, or Linux machine over Wi-Fi, USB, Hotspot, or Bluetooth tethering. Featuring bidirectional control sync, multi-device party broadcast & relay, virtual microphone routing, and live latency telemetry.

          ---

          #### 📦 Official Platform Deliverables:

          - 🪟 **Windows 11 / 10**: [`PhoneSpeaker.v2.exe`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker.v2.exe) *(or `PhoneSpeaker v2.exe`)*
            - Standalone 64-bit executable with CoreAudio/WASAPI volume sync, Opus codec & soft-knee limiter.
          - 🤖 **Android (8.0–15+)**: [`PhoneSpeaker.v2.apk`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker.v2.apk) *(or `PhoneSpeaker v2.apk`)*
            - Native client powered by C++ Oboe / AAudio ultra-low-latency engine, audio focus management & wireless mic server. Universal APK for `arm64-v8a`, `armeabi-v7a`, `x86_64`, and `x86`.
          - 🐧 **Linux (PipeWire / PulseAudio)**: [`PhoneSpeaker-v2-Linux-Installer.run`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker-v2-Linux-Installer.run)
            - One-click self-extracting installer with automatic virtual sink & source routing (`PhoneSpeaker_Sink` / `PhoneSpeaker_Mic`).
            - *Quick terminal install:* `curl -sSL https://raw.githubusercontent.com/HSAdib/PhoneSpeaker/main/install_linux.sh | bash`
          - 🍏 **macOS (Apple Silicon & Intel)**: [`PhoneSpeaker-v2-macOS.dmg`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker-v2-macOS.dmg) & [`PhoneSpeaker-v2-macOS-Installer.command`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker-v2-macOS-Installer.command)
            - Drag-and-drop `.dmg` app bundle and interactive terminal installer supporting BlackHole 2ch loopback and system volume sync.
          - 📱 **iOS (iPhone & iPad)**: [`PhoneSpeaker-v2-iOS.ipa`](https://github.com/HSAdib/PhoneSpeaker/releases/download/v2.0.0/PhoneSpeaker-v2-iOS.ipa)
            - Native Swift / AVAudioEngine client for AltStore, SideStore, and Sideloadly.

          ---

          #### 🌟 Key Capabilities:
          - **Ultra-Low Latency**: Sub-30ms wireless streaming using 5ms PCM16 / Opus frame pacing.
          - **Bi-directional Audio**: Stream PC audio to phones, and stream phone microphone to PC (Discord, Zoom, OBS).
          - **Party Mode & Multi-Device Fan-Out**: Broadcast from 1 Host PC/Phone to unlimited joiners with mesh relaying.
          - **Two-Way Studio Sync**: Automatic bidirectional synchronization of volume, mute, audio profile, bitrate, and buffer latency.
          - **Universal Container Mirror**: All packages mirrored to GitHub Packages OCI Registry at `ghcr.io/hsadib/phonespeaker:2.0.0`.
          EOF

          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "PhoneSpeaker v2.0 Studio" --notes-file RELEASE_NOTES.md

          gh release edit "$TAG_NAME" --title "PhoneSpeaker v2.0 Studio" --notes-file RELEASE_NOTES.md || true

          if [ ! -f "PhoneSpeaker v2.exe" ] && [ ! -f "PhoneSpeaker.v2.exe" ]; then
            gh release download "$TAG_NAME" -p "*.exe" --clobber 2>/dev/null || true
          fi
          if [ ! -f "PhoneSpeaker v2.apk" ] && [ ! -f "PhoneSpeaker.v2.apk" ]; then
            gh release download "$TAG_NAME" -p "*.apk" --clobber 2>/dev/null || true
          fi

          cp -f "PhoneSpeaker v2.exe" "PhoneSpeaker.v2.exe" 2>/dev/null || true
          cp -f "PhoneSpeaker v2.apk" "PhoneSpeaker.v2.apk" 2>/dev/null || true

          for f in \
            "PhoneSpeaker.v2.exe" \
            "PhoneSpeaker.v2.apk" \
            "PhoneSpeaker-v2-Linux-Installer.run" \
            "PhoneSpeaker-v2-macOS-Installer.command" \
            "PhoneSpeaker-v2-macOS.dmg" \
            "PhoneSpeaker-v2-iOS.ipa" \
            "install_linux.sh"; do
            if [ -f "$f" ]; then
              echo "Uploading $f to Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            fi
          done

      # ----------------------------------------------------
      # 5. PUBLISH TO GITHUB PACKAGES SECTION (ghcr.io/hsadib/phonespeaker)
      # ----------------------------------------------------
      - name: Publish Installers to GitHub Packages (GHCR OCI Registry)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG_REF="ghcr.io/${OWNER_LC}/phonespeaker"

          ORAS_FILES=()
          [ -f "PhoneSpeaker.v2.exe" ] && ORAS_FILES+=("PhoneSpeaker.v2.exe:application/vnd.microsoft.portable-executable")
          [ -f "PhoneSpeaker.v2.apk" ] && ORAS_FILES+=("PhoneSpeaker.v2.apk:application/vnd.android.package-archive")
          [ -f "PhoneSpeaker-v2-Linux-Installer.run" ] && ORAS_FILES+=("PhoneSpeaker-v2-Linux-Installer.run:application/x-executable")
          [ -f "PhoneSpeaker-v2-macOS-Installer.command" ] && ORAS_FILES+=("PhoneSpeaker-v2-macOS-Installer.command:application/x-sh")
          [ -f "PhoneSpeaker-v2-macOS.dmg" ] && ORAS_FILES+=("PhoneSpeaker-v2-macOS.dmg:application/x-apple-diskimage")
          [ -f "PhoneSpeaker-v2-iOS.ipa" ] && ORAS_FILES+=("PhoneSpeaker-v2-iOS.ipa:application/octet-stream")
          [ -f "install_linux.sh" ] && ORAS_FILES+=("install_linux.sh:application/x-sh")

          echo "Pushing ${#ORAS_FILES[@]} deliverables to $PKG_REF..."
          oras push "${PKG_REF}:latest" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=PhoneSpeaker v2.0 Studio — Official Installers for Windows (.exe), Linux (.run), macOS (.dmg & .command), Android (.apk), and iOS (.ipa)" \
            --annotation "org.opencontainers.image.version=2.0.0" \
            "${ORAS_FILES[@]}"

          oras tag "${PKG_REF}:latest" "2.0.0"
