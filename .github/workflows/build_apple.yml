name: PhoneSpeaker CI & Release Pipeline

on:
  push:
    branches: [ "main", "master", "fix/*" ]
    tags: [ "v2.1*", "v2.0*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. ANDROID BUILD JOB (Java 17 Temurin & assembleRelease)
  # ====================================================
  build-android:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.1.8937393" "cmake;3.22.1" || true

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            echo "PHONESPEAKER_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No keystore secret found, skipping release signing."
          fi

      - name: Run Android Unit Tests
        run: |
          cd PhoneSpeakerAndroid
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build Android Release APK
        run: |
          cd PhoneSpeakerAndroid
          ./gradlew assembleRelease || ./gradlew assembleDebug
          rm -f /tmp/release.keystore

      - name: Locate and Package Android Artifact
        run: |
          APK_PATH=$(find PhoneSpeakerAndroid/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, checking debug build..."
            APK_PATH=$(find PhoneSpeakerAndroid/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "Build APK not found, checking repository root..."
            [ -f "PhoneSpeaker.v2.1.apk" ] && APK_PATH="PhoneSpeaker.v2.1.apk"
            [ -f "PhoneSpeaker v2.apk" ] && [ -z "$APK_PATH" ] && APK_PATH="PhoneSpeaker v2.apk"
          fi
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" PhoneSpeaker.v2.1.apk
          cp "$APK_PATH" "PhoneSpeaker v2.apk"
          sha256sum PhoneSpeaker.v2.1.apk | tee PhoneSpeaker.v2.1.apk.sha256

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2.1-APK
          path: |
            PhoneSpeaker.v2.1.apk
            PhoneSpeaker v2.apk

  # ====================================================
  # 2. WINDOWS BUILD JOB (Python 3.11, Tests & PyInstaller)
  # ====================================================
  build-windows:
    name: Build Windows 64-bit Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Run Verification Tests
        run: |
          cd phonespeaker-pc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests/verify_pc.py

      - name: Compile Windows Standalone Executable
        run: |
          cd phonespeaker-pc
          python build_exe.py

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Copy-Item "PhoneSpeaker.v2.exe" "PhoneSpeaker.v2.1.exe" -Force
          Get-FileHash -Algorithm SHA256 "PhoneSpeaker.v2.1.exe" | Out-File "PhoneSpeaker.v2.1.exe.sha256"
          Write-Host "Windows EXE SHA256:"
          Get-Content "PhoneSpeaker.v2.1.exe.sha256"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2.1-EXE
          path: |
            PhoneSpeaker.v2.1.exe
            PhoneSpeaker.v2.exe
            PhoneSpeaker-v2-Linux-Installer.run
            PhoneSpeaker-v2-macOS-Installer.command

  # ====================================================
  # 3. MACOS & IOS BUILD JOB (Xcode & DMG / IPA Packaging)
  # ====================================================
  build-apple:
    name: Build macOS DMG & iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for macOS
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS Audio & Build Dependencies
        run: |
          brew install opus portaudio python@3.11 python-tk@3.11 xcodegen oras

      - name: Build macOS Application Bundle & DMG
        run: |
          cd phonespeaker-pc
          /opt/homebrew/bin/python3.11 build_macos.py || python3 build_macos.py

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd PhoneSpeakeriOS
          xcodegen generate

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          cd PhoneSpeakeriOS
          xcodebuild archive \
            -project PhoneSpeaker.xcodeproj \
            -scheme PhoneSpeaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/PhoneSpeaker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd PhoneSpeakeriOS
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/PhoneSpeaker.xcarchive/Products/Applications/PhoneSpeaker.app" Payload/
          zip -r -q ../PhoneSpeaker-v2-iOS.ipa Payload
          cd ..

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-Apple-Deliverables
          path: |
            PhoneSpeaker-v2-macOS.dmg
            PhoneSpeaker-v2-iOS.ipa

  # ====================================================
  # 4. OFFICIAL RELEASE PUBLICATION (On v2.1 Tag or v2.0 Tag)
  # ====================================================
  release-publish:
    name: Publish Official v2.1 Release
    needs: [build-android, build-windows, build-apple]
    if: always() && (startsWith(github.ref, 'refs/tags/v2.1') || startsWith(github.ref, 'refs/tags/v2.0') || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PhoneSpeaker-v2.1-APK
          path: release-artifacts/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PhoneSpeaker-v2.1-EXE
          path: release-artifacts/

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PhoneSpeaker-v2-Apple-Deliverables
          path: release-artifacts/

      - name: Populate Release Artifacts from Repository
        run: |
          mkdir -p release-artifacts
          for f in "PhoneSpeaker.v2.1.exe" "PhoneSpeaker.v2.exe" "PhoneSpeaker.v2.1.apk" "PhoneSpeaker v2.apk" \
                   "PhoneSpeaker-v2-Linux-Installer.run" "PhoneSpeaker-v2-macOS-Installer.command" \
                   "PhoneSpeaker-v2-macOS.dmg" "PhoneSpeaker-v2-iOS.ipa" "install_linux.sh"; do
            if [ -f "$f" ] && [ ! -f "release-artifacts/$f" ]; then
              echo "Populating $f from repository..."
              cp "$f" release-artifacts/
            fi
          done

      - name: Generate Checksums & Build Manifest
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v2.1.0"
          fi

          cat << 'EOF' > RELEASE_NOTES.md
          ### PhoneSpeaker v2.1 Studio — Complete Cross-Platform Overhaul

          Low-latency wireless audio streaming & internal system audio studio for Windows 11, macOS, Linux, Android, and iOS.

          #### Unified Architecture Highlights:
          - **Zero-Loss PCM16 Playout:** Default 48 kHz stereo lossless PCM16 transmission with sub-35 ms latency, lock-free SPSC PCM ring buffer, and hardened prebuffering.
          - **Option A Internal System Audio Capture (SERVE):** Stream internal audio directly from Android 10+ (MediaProjection AudioPlaybackCaptureConfiguration) and iOS (ReplayKit app audio capture) on UDP port 5004.
          - **Unified Monospace UI:** Exact identical tabs across all platforms:
            - **Phone (Android & iOS — Exactly 4 Tabs):** `[ PLAY ]` *(Default on startup)* | `[ SERVE ]` | `[ PARTY ]` | `[ SETTINGS ]`
            - **PC (Windows, macOS, Linux — Exactly 5 Tabs):** `[ PLAY ]` | `[ SERVE ]` *(Default on startup)* | `[ PARTY ]` | `[ SETTINGS ]` | `[ VIRTUAL DEVICE ]`
          - **Complete Port 5006 Mic Removal:** Legacy mic features and Port 5006 permanently removed in favor of bidirectional system audio streaming on UDP 5004 and Control/Sync on UDP 5005.
          - **Multi-Device Party Mode:** Synchronized multi-device broadcasting and daisy-chain personal hotspot extension.

          #### Deliverables for All 5 Operating Systems:
          - **Windows 11 / 10:** `PhoneSpeaker.v2.1.exe` (Standalone 64-bit executable with WASAPI loopback)
          - **Android:** `PhoneSpeaker.v2.1.apk` (C++ Oboe AAudio player & MediaProjection internal audio streamer)
          - **macOS:** `PhoneSpeaker-v2-macOS.dmg` & `PhoneSpeaker-v2-macOS-Installer.command` (Apple Silicon & Intel DMG)
          - **iOS:** `PhoneSpeaker-v2-iOS.ipa` (AVAudioEngine player & ReplayKit internal streamer for sideloading)
          - **Linux:** `PhoneSpeaker-v2-Linux-Installer.run` (PipeWire & PulseAudio one-click self-extracting installer)
          EOF

          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "PhoneSpeaker v2.1 Studio" --notes-file RELEASE_NOTES.md

          gh release edit "$TAG_NAME" --title "PhoneSpeaker v2.1 Studio" --notes-file RELEASE_NOTES.md || true

          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            fi
          done

      # ----------------------------------------------------
      # 5. PUBLISH TO GITHUB PACKAGES SECTION (ghcr.io/hsadib/phonespeaker)
      # ----------------------------------------------------
      - name: Publish Installers to GitHub Packages (GHCR OCI Registry)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG_REF="ghcr.io/${OWNER_LC}/phonespeaker"

          ORAS_FILES=()
          for f in release-artifacts/*; do
            [ -f "$f" ] && ORAS_FILES+=("$f")
          done

          if [ ${#ORAS_FILES[@]} -gt 0 ]; then
            echo "Pushing ${#ORAS_FILES[@]} deliverables to $PKG_REF..."
            oras push "${PKG_REF}:latest" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "org.opencontainers.image.description=PhoneSpeaker v2.1 Studio — Official Installers for Windows, Linux, macOS, Android, and iOS" \
              --annotation "org.opencontainers.image.version=2.1.0" \
              "${ORAS_FILES[@]}"

            oras tag "${PKG_REF}:latest" "2.1.0"
          fi
