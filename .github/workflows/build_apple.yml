name: PhoneSpeaker CI & Release Pipeline

on:
  push:
    branches: [ "main", "master", "fix/*" ]
    tags: [ "v2.0.1*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. ANDROID BUILD JOB (Java 17 Temurin & assembleRelease)
  # ====================================================
  build-android:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Decode Android Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          echo "PHONESPEAKER_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
          echo "PHONESPEAKER_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "PHONESPEAKER_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "PHONESPEAKER_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Run Android Unit Tests
        run: |
          cd PhoneSpeakerAndroid
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build Android Release APK
        run: |
          cd PhoneSpeakerAndroid
          ./gradlew assembleRelease
          rm -f /tmp/release.keystore

      - name: Locate and Package Android Artifact
        run: |
          APK_PATH=$(find PhoneSpeakerAndroid/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, checking debug build..."
            cd PhoneSpeakerAndroid && ./gradlew assembleDebug && cd ..
            APK_PATH=$(find PhoneSpeakerAndroid/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          echo "Selected APK: $APK_PATH"
          cp "$APK_PATH" PhoneSpeaker.v2.0.1.apk
          sha256sum PhoneSpeaker.v2.0.1.apk | tee PhoneSpeaker.v2.0.1.apk.sha256

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2.0.1-APK
          path: PhoneSpeaker.v2.0.1.apk

  # ====================================================
  # 2. WINDOWS BUILD JOB (Python 3.11, Tests & PyInstaller)
  # ====================================================
  build-windows:
    name: Build Windows 64-bit Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Run Verification Tests
        run: |
          cd phonespeaker-pc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests/verify_pc.py

      - name: Compile Windows Standalone Executable
        run: |
          cd phonespeaker-pc
          python build_exe.py

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Copy-Item "PhoneSpeaker.v2.exe" "PhoneSpeaker.v2.0.1.exe" -Force
          Get-FileHash -Algorithm SHA256 "PhoneSpeaker.v2.0.1.exe" | Out-File "PhoneSpeaker.v2.0.1.exe.sha256"
          Write-Host "Windows EXE SHA256:"
          Get-Content "PhoneSpeaker.v2.0.1.exe.sha256"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2.0.1-EXE
          path: PhoneSpeaker.v2.0.1.exe

  # ====================================================
  # 3. MACOS & IOS BUILD JOB (Xcode & DMG / IPA Packaging)
  # ====================================================
  build-apple:
    name: Build macOS DMG & iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for macOS
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS Audio & Build Dependencies
        run: |
          brew install opus portaudio python@3.11 python-tk@3.11 xcodegen oras

      - name: Build macOS Application Bundle & DMG
        run: |
          cd phonespeaker-pc
          /opt/homebrew/bin/python3.11 build_macos.py || python3 build_macos.py

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd PhoneSpeakeriOS
          xcodegen generate

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          cd PhoneSpeakeriOS
          xcodebuild archive \
            -project PhoneSpeaker.xcodeproj \
            -scheme PhoneSpeaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/PhoneSpeaker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd PhoneSpeakeriOS
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/PhoneSpeaker.xcarchive/Products/Applications/PhoneSpeaker.app" Payload/
          zip -r -q ../PhoneSpeaker-v2-iOS.ipa Payload
          cd ..

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-Apple-Deliverables
          path: |
            PhoneSpeaker-v2-macOS.dmg
            PhoneSpeaker-v2-iOS.ipa

  # ====================================================
  # 4. OFFICIAL RELEASE PUBLICATION (Only on v2.0.1 Tag)
  # ====================================================
  release-publish:
    name: Publish Official v2.0.1 Release
    needs: [build-android, build-windows, build-apple]
    if: startsWith(github.ref, 'refs/tags/v2.0.1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoneSpeaker-v2.0.1-APK
          path: release-artifacts/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoneSpeaker-v2.0.1-EXE
          path: release-artifacts/

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        with:
          name: PhoneSpeaker-v2-Apple-Deliverables
          path: release-artifacts/

      - name: Generate Checksums & Build Manifest
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          EXE_SHA=$(sha256sum PhoneSpeaker.v2.0.1.exe | awk '{print $1}')
          EXE_SIZE=$(stat -c%s PhoneSpeaker.v2.0.1.exe)
          APK_SHA=$(sha256sum PhoneSpeaker.v2.0.1.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s PhoneSpeaker.v2.0.1.apk)

          cat << EOF > build-manifest.json
          {
            "version": "2.0.1",
            "gitCommit": "${{ github.sha }}",
            "artifacts": [
              {
                "name": "PhoneSpeaker.v2.0.1.exe",
                "sha256": "$EXE_SHA",
                "size": $EXE_SIZE,
                "builder": "github-actions"
              },
              {
                "name": "PhoneSpeaker.v2.0.1.apk",
                "sha256": "$APK_SHA",
                "size": $APK_SIZE,
                "builder": "github-actions"
              }
            ]
          }
          EOF
          cat build-manifest.json

      - name: Create GitHub Release v2.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v2.0.1"
          gh release create "$TAG_NAME" \
            --title "PhoneSpeaker v2.0.1 Studio" \
            --notes "### PhoneSpeaker v2.0.1 Studio\n\nRelease v2.0.1 addressing thread concurrency, lifecycle synchronization, lock-free SPSC PCM ring buffer, Opus in-band FEC sequencing, and real-time audio callback safety." \
            release-artifacts/*
