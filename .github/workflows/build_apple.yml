name: Air Speaker CI & Release Pipeline

on:
  push:
    branches: [ "main", "master", "fix/*" ]
    tags: [ "v1.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ====================================================
  # 1. ANDROID BUILD JOB (Java 17 Temurin & assembleRelease)
  # ====================================================
  build-android:
    name: Build Android APK (Release & Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" || true

      - name: Decode Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            echo "AIRSPEAKER_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "AIRSPEAKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "AIRSPEAKER_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "AIRSPEAKER_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "PHONESPEAKER_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No keystore secret found, skipping release signing."
          fi

      - name: Run Native Audio C++ Tests
        run: |
          g++ -std=c++17 -O2 -pthread -DAIRSPEAKER_UNIT_TEST \
            -I"AirSpeakerAndroid/app/src/main/cpp" \
            "AirSpeakerAndroid/app/src/main/cpp/test_native_pipeline.cpp" \
            "AirSpeakerAndroid/app/src/main/cpp/jitter_buffer.cpp" \
            "AirSpeakerAndroid/app/src/main/cpp/opus_wrapper.cpp" \
            -o test_pipeline
          ./test_pipeline

      - name: Run Android Unit Tests
        run: |
          cd AirSpeakerAndroid
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build Android APK
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          APP_VER="1.0.2"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            APP_VER="${GITHUB_REF_NAME#v}"
          fi
          export AIRSPEAKER_VERSION="$APP_VER"
          cd AirSpeakerAndroid
          if [ -n "$PHONESPEAKER_KEYSTORE_PATH" ] && [ -f "$PHONESPEAKER_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease
          else
            echo "No release keystore configured — building signed debug APK so it installs cleanly on devices."
            ./gradlew assembleDebug
          fi
          rm -f /tmp/release.keystore

      - name: Locate, Verify, and Package Android Artifacts
        run: |
          APK_DIR="AirSpeakerAndroid/app/build/outputs/apk/release"
          if [ ! -d "$APK_DIR" ] || [ -z "$(find "$APK_DIR" -name "*.apk" 2>/dev/null)" ]; then
            APK_DIR="AirSpeakerAndroid/app/build/outputs/apk/debug"
          fi
          echo "Using APK directory: $APK_DIR"
          ls -la "$APK_DIR"

          mkdir -p android-deliverables

          # Locate build-tools apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          copy_and_verify() {
            local pattern="$1"
            local dest="$2"
            local src=$(find "$APK_DIR" -name "*-${pattern}-*.apk" ! -name "*unsigned*" 2>/dev/null | head -n 1)
            if [ -z "$src" ] || [ ! -f "$src" ]; then
              echo "ERROR: Missing required APK variant for $pattern in $APK_DIR"
              exit 1
            fi
            echo "Verifying signature for $src ..."
            $APKSIGNER verify --verbose "$src" || {
              echo "ERROR: $src signature verification failed!"
              exit 1
            }
            cp -f "$src" "android-deliverables/$dest"
            echo "Packaged: android-deliverables/$dest (from $src)"
          }

          copy_and_verify "arm64-v8a" "AirSpeaker-v1-arm64-v8a.apk"
          copy_and_verify "armeabi-v7a" "AirSpeaker-v1-armeabi-v7a.apk"
          copy_and_verify "x86_64" "AirSpeaker-v1-x86_64.apk"
          copy_and_verify "x86" "AirSpeaker-v1-x86.apk"
          copy_and_verify "universal" "AirSpeaker-v1-universal.apk"

          # Universal alias for backward compatibility
          cp -f "android-deliverables/AirSpeaker-v1-universal.apk" "android-deliverables/AirSpeaker-v1.apk"

          cd android-deliverables
          sha256sum *.apk | tee SHA256SUMS-android.txt
          ls -la

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirSpeaker-v1-APK
          path: |
            android-deliverables/*.apk
            android-deliverables/SHA256SUMS-android.txt

  # ====================================================
  # 2. WINDOWS BUILD JOB (Inno Setup 6 + PyInstaller)
  # ====================================================
  build-windows:
    name: Build Windows Setup & Portable
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Inno Setup 6 Compiler
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and !(Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies, Acquire Opus & Run Verification Tests
        run: |
          cd airspeaker-pc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python vendor/get_opus.py
          python tests/verify_pc.py

      - name: Compile Windows Setup & Portable Executables
        run: |
          cd airspeaker-pc
          python build_exe.py

      - name: Verify Windows Artifacts & Generate Checksums
        shell: pwsh
        run: |
          if (!(Test-Path "AirSpeaker-v1-Portable.exe")) {
            Write-Error "Missing AirSpeaker-v1-Portable.exe"
            exit 1
          }
          if (!(Test-Path "AirSpeaker-v1-Setup.exe")) {
            Write-Error "Missing AirSpeaker-v1-Setup.exe"
            exit 1
          }
          Get-FileHash -Algorithm SHA256 "AirSpeaker-v1-Portable.exe" | Out-File "AirSpeaker-v1-Portable.exe.sha256"
          Get-FileHash -Algorithm SHA256 "AirSpeaker-v1-Setup.exe" | Out-File "AirSpeaker-v1-Setup.exe.sha256"
          Write-Host "Windows Deliverables:"
          Get-ChildItem -Filter "AirSpeaker-v1-*"

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirSpeaker-v1-Windows
          path: |
            AirSpeaker-v1-Setup.exe
            AirSpeaker-v1-Portable.exe

  # ====================================================
  # 3. LINUX BUILD JOB (Persistent Bundle & Tarball)
  # ====================================================
  build-linux:
    name: Build Linux Application Bundle & Tarball
    runs-on: ubuntu-22.04
    env:
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libopus-dev portaudio19-dev python3-tk pulseaudio-utils

      - name: Install Python Requirements & Run Verification Tests
        run: |
          cd airspeaker-pc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyaudio || true
          python tests/verify_pc.py

      - name: Build Linux Application Bundle & Tarball
        run: |
          cd airspeaker-pc
          python build_linux.py
          ./dist/AirSpeaker/AirSpeaker --version

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSpeaker-v1-Linux
          path: |
            AirSpeaker-v1-Linux-x86_64.tar.gz

  # ====================================================
  # 4. MACOS & IOS BUILD JOB (Xcode & DMG / IPA Packaging)
  # ====================================================
  build-apple:
    name: Build macOS DMG & iOS IPA
    runs-on: macos-latest
    env:
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 for macOS
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS Audio & Build Dependencies
        run: |
          brew install opus portaudio python@3.11 python-tk@3.11 xcodegen

      - name: Build macOS Application Bundle & DMG
        run: |
          cd airspeaker-pc
          /opt/homebrew/bin/python3.11 build_macos.py || python3 build_macos.py

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Inject Version & Build SHA into iOS project.yml & Generate Xcode Project
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -z "$SHORT_SHA" ]; then SHORT_SHA="dev"; fi
          APP_VER="1.0.2"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            APP_VER="${GITHUB_REF_NAME#v}"
          fi
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$APP_VER\"/" AirSpeakeriOS/project.yml || true
          sed -i '' "s/AirSpeakerBuildSHA: .*/AirSpeakerBuildSHA: \"$SHORT_SHA\"/" AirSpeakeriOS/project.yml || true
          cd AirSpeakeriOS
          xcodegen generate

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          cd AirSpeakeriOS
          xcodebuild archive \
            -project AirSpeaker.xcodeproj \
            -scheme AirSpeaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/AirSpeaker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd AirSpeakeriOS
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/AirSpeaker.xcarchive/Products/Applications/AirSpeaker.app" Payload/
          zip -r -q ../AirSpeaker-v1-iOS.ipa Payload
          cd ..

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirSpeaker-v1-Apple-Deliverables
          path: |
            AirSpeaker-v1-macOS.dmg
            AirSpeaker-v1-iOS.ipa

  # ====================================================
  # 5. OFFICIAL RELEASE PUBLICATION (All 5 Operating Systems)
  # ====================================================
  release-publish:
    name: Publish Official Release Deliverables
    needs: [build-android, build-windows, build-linux, build-apple]
    if: (startsWith(github.ref, 'refs/tags/v1.') || github.ref_name == 'main') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AirSpeaker-v1-APK
          path: release-artifacts/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AirSpeaker-v1-Windows
          path: release-artifacts/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: AirSpeaker-v1-Linux
          path: release-artifacts/

      - name: Download Apple Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AirSpeaker-v1-Apple-Deliverables
          path: release-artifacts/

      - name: Copy Linux Installer Script
        run: |
          mkdir -p release-artifacts
          cp -f install_linux.sh release-artifacts/

      - name: Generate Checksums & Build Manifest
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v1.0.0"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ -z "$SHORT_SHA" ]; then SHORT_SHA="dev"; fi

          cat << EOF > RELEASE_NOTES.md
          <!-- build: ${SHORT_SHA} -->
          ### Air Speaker v1.0 Studio — Complete Cross-Platform Overhaul

          Low-latency wireless audio streaming & internal system audio studio for Windows 11, macOS, Linux, Android, and iOS.

          #### Unified Architecture Highlights:
          - **Zero-Loss PCM16 Playout:** Default 48 kHz stereo lossless PCM16 transmission with sub-35 ms latency, lock-free SPSC PCM ring buffer, and hardened prebuffering.
          - **Option A Internal System Audio Capture (SERVE):** Stream internal audio directly from Android 10+ (MediaProjection AudioPlaybackCaptureConfiguration) and iOS (ReplayKit app audio capture) on UDP port 5004.
          - **Real-Time Live Delay Graphs:** Real-time buffer latency and jitter visualization active across all PLAY, SERVE, and PARTY (Host & Join) tabs on PC, Android, and iOS.
          - **Unified Monospace UI:** Exact identical tabs across all platforms:
            - **Phone (Android & iOS — Exactly 4 Tabs):** \`[ PLAY ]\` *(Default on startup)* | \`[ SERVE ]\` | \`[ PARTY ]\` | \`[ SETTINGS ]\`
            - **PC (Windows, macOS, Linux — Exactly 5 Tabs):** \`[ PLAY ]\` | \`[ SERVE ]\` *(Default on startup)* | \`[ PARTY ]\` | \`[ SETTINGS ]\` | \`[ VIRTUAL DEVICE ]\`
          - **Multi-Device Party Mode:** Synchronized multi-device broadcasting and daisy-chain personal hotspot extension.
          - **Automatic Update Checking:** Non-blocking GitHub release & rebuild notifications across all 5 operating systems.

          #### Deliverables for All 5 Operating Systems:
          - **Windows (Installed App):** \`AirSpeaker-v1-Setup.exe\` (Native Start Menu & Windows Settings setup)
          - **Windows (Portable):** \`AirSpeaker-v1-Portable.exe\` (Standalone zero-install single-file executable)
          - **Android (Architecture Splits + Universal APK):**
            - \`AirSpeaker-v1-arm64-v8a.apk\` — **Recommended for modern phones** (64-bit ARM, smaller download & optimal performance)
            - \`AirSpeaker-v1-universal.apk\` — **Universal APK** (All architectures bundled, fallback if unsure of your CPU)
            - \`AirSpeaker-v1.apk\` — *(Universal compatibility alias)*
            - \`AirSpeaker-v1-armeabi-v7a.apk\` — Older 32-bit ARM phones
            - \`AirSpeaker-v1-x86_64.apk\` — 64-bit x86 tablets, emulators & ChromeOS
            - \`AirSpeaker-v1-x86.apk\` — 32-bit x86 emulators & devices
          - **macOS:** \`AirSpeaker-v1-macOS.dmg\` (Drag-and-Drop installer with Applications symlink)
          - **Linux:** \`AirSpeaker-v1-Linux-x86_64.tar.gz\` & One-Click Installer (\`install_linux.sh\`)
          - **iOS:** \`AirSpeaker-v1-iOS.ipa\` (AVAudioEngine player & ReplayKit internal streamer for sideloading)
          EOF

          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "Air Speaker v1.0 Studio" --notes-file RELEASE_NOTES.md

          gh release edit "$TAG_NAME" --title "Air Speaker v1.0 Studio" --notes-file RELEASE_NOTES.md || true

          for f in release-artifacts/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            fi
          done

      # ----------------------------------------------------
      # 6. PUBLISH TO GITHUB PACKAGES (GHCR OCI Registry)
      # ----------------------------------------------------
      - name: Set up ORAS CLI
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@v1

      - name: Publish Installers to GitHub Packages (GHCR OCI Registry)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG_REF="ghcr.io/${OWNER_LC}/airspeaker"

          cd release-artifacts
          ORAS_FILES=()
          for f in *; do
            [ -f "$f" ] && ORAS_FILES+=("$f")
          done

          if [ ${#ORAS_FILES[@]} -gt 0 ]; then
            echo "Pushing ${#ORAS_FILES[@]} deliverables to $PKG_REF..."
            oras push --disable-path-validation "${PKG_REF}:latest" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "org.opencontainers.image.description=Air Speaker v1.0 Studio — Official Installers for Windows, Linux, macOS, Android, and iOS" \
              --annotation "org.opencontainers.image.version=1.0.0" \
              "${ORAS_FILES[@]}"

            oras tag "${PKG_REF}:latest" "1.0.0"
          fi
