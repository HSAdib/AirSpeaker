name: Build & Publish All Deliverables (GitHub Releases & Packages)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build macOS DMG, iOS IPA & Publish to Releases + Packages
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. BUILD MACOS DMG (PhoneSpeaker-v2-macOS.dmg)
      # ----------------------------------------------------
      - name: Set up Python 3.11 for macOS
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install macOS Audio & Build Dependencies via Homebrew
        run: |
          brew install opus portaudio python-tk xcodegen oras

      - name: Build macOS Application Bundle & DMG
        run: |
          cd phonespeaker-pc
          python3 build_macos.py

      - name: Verify macOS DMG Artifact
        run: |
          ls -lh PhoneSpeaker-v2-macOS.dmg

      # ----------------------------------------------------
      # 2. BUILD IOS APP & IPA (PhoneSpeaker-v2-iOS.ipa)
      # ----------------------------------------------------
      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate Xcode Project with XcodeGen
        run: |
          cd PhoneSpeakeriOS
          xcodegen generate

      - name: Build iOS Archive (Unsigned for Sideloading)
        run: |
          cd PhoneSpeakeriOS
          xcodebuild archive \
            -project PhoneSpeaker.xcodeproj \
            -scheme PhoneSpeaker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/PhoneSpeaker.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (Payload zip for AltStore / SideStore / Sideloadly)
        run: |
          cd PhoneSpeakeriOS
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/PhoneSpeaker.xcarchive/Products/Applications/PhoneSpeaker.app" Payload/
          zip -r -q ../PhoneSpeaker-v2-iOS.ipa Payload
          cd ..
          ls -lh PhoneSpeaker-v2-iOS.ipa

      # ----------------------------------------------------
      # 3. UPLOAD WORKFLOW ARTIFACTS
      # ----------------------------------------------------
      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-macOS-DMG
          path: PhoneSpeaker-v2-macOS.dmg

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpeaker-v2-iOS-IPA
          path: PhoneSpeaker-v2-iOS.ipa

      # ----------------------------------------------------
      # 4. PUBLISH ALL DEVICE INSTALLERS TO GITHUB RELEASE (v2.0.0 / Latest)
      # ----------------------------------------------------
      - name: Publish All Device Installers to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v2.0.0"
          fi
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "PhoneSpeaker v2.0 Studio (All Platforms)" --notes "Latest cross-platform installers for Windows, Linux, macOS, Android, and iOS."

          cp -f "PhoneSpeaker v2.exe" "PhoneSpeaker.v2.exe" 2>/dev/null || true
          cp -f "PhoneSpeaker v2.apk" "PhoneSpeaker.v2.apk" 2>/dev/null || true

          for f in \
            "PhoneSpeaker v2.exe" \
            "PhoneSpeaker.v2.exe" \
            "PhoneSpeaker v2.apk" \
            "PhoneSpeaker.v2.apk" \
            "PhoneSpeaker-v2-Linux-Installer.run" \
            "PhoneSpeaker-v2-macOS-Installer.command" \
            "PhoneSpeaker-v2-macOS.dmg" \
            "PhoneSpeaker-v2-iOS.ipa" \
            "install_linux.sh"; do
            if [ -f "$f" ]; then
              echo "Uploading $f to Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            fi
          done

      # ----------------------------------------------------
      # 5. PUBLISH TO GITHUB PACKAGES SECTION (ghcr.io/hsadib/phonespeaker)
      # ----------------------------------------------------
      - name: Publish Installers to GitHub Packages (GHCR OCI Registry)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PKG_REF="ghcr.io/${OWNER_LC}/phonespeaker"

          oras push "${PKG_REF}:latest" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=PhoneSpeaker v2.0 Studio — Official Installers for Windows (.exe), Linux (.run), macOS (.dmg & .command), Android (.apk), and iOS (.ipa)" \
            --annotation "org.opencontainers.image.version=2.0.0" \
            "PhoneSpeaker.v2.exe:application/vnd.microsoft.portable-executable" \
            "PhoneSpeaker.v2.apk:application/vnd.android.package-archive" \
            "PhoneSpeaker-v2-Linux-Installer.run:application/x-executable" \
            "PhoneSpeaker-v2-macOS-Installer.command:application/x-sh" \
            "PhoneSpeaker-v2-macOS.dmg:application/x-apple-diskimage" \
            "PhoneSpeaker-v2-iOS.ipa:application/octet-stream" \
            "install_linux.sh:application/x-sh"

          oras tag "${PKG_REF}:latest" "2.0.0"
